[project]
name = "humanos-browser-worker"
version = "0.1.0"
description = "Scoped local Browser Use worker for HumanOS workflow browser steps"
requires-python = ">=3.12,<3.13"
dependencies = [
  # BrowserSession + actor Page/Element verified in this exact release. The
  # autonomous Agent loop is deliberately never imported by the worker.
  "browser-use==0.13.10",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
