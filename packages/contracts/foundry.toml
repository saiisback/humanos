[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
dynamic_test_linking = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# Official ENSv2 remappings (docs.ens.domains/ensv2/tutorial-contract-developers) plus the
# pinned repo's own remappings, scoped to the dependency tree so its sources compile as-is.
remappings = [
  "@ensdomains/contracts-v2/=lib/contracts-v2/contracts/src/",
  "@ensdomains/contracts-v2-test/=lib/contracts-v2/contracts/test/",
  "@openzeppelin/contracts/=lib/contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/contracts-v2/contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
  "@ensdomains/verifiable-factory/=lib/contracts-v2/contracts/lib/verifiable-factory/src/",
  "@ens/contracts/=lib/contracts-v2/contracts/lib/ens-contracts/contracts/",
  "@ensdomains/buffer/=lib/contracts-v2/contracts/lib/buffer/",
  "@unruggable/gateways/=lib/contracts-v2/contracts/lib/unruggable-gateways/",
  "solady/=lib/contracts-v2/contracts/lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
  "lib/contracts-v2/contracts/:@openzeppelin/contracts-v5/=lib/contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
  "lib/contracts-v2/contracts/:@ens/contracts/utils/LibMem/=lib/contracts-v2/contracts/src/utils/",
  "lib/contracts-v2/contracts/lib/ens-contracts/:@openzeppelin/contracts=lib/contracts-v2/contracts/lib/openzeppelin-contracts-v4/contracts",
  "lib/contracts-v2/contracts/lib/ens-contracts/:@openzeppelin/contracts-v5=lib/contracts-v2/contracts/lib/openzeppelin-contracts/contracts",
  "lib/contracts-v2/contracts/lib/ens-contracts/:@ensdomains/solsha1/contracts=lib/contracts-v2/contracts/lib/solsha1/contracts",
  "lib/contracts-v2/contracts/lib/ens-contracts/:@unruggable/gateways/=lib/contracts-v2/contracts/lib/unruggable-gateways/contracts",
  "lib/contracts-v2/contracts/lib/ens-contracts/contracts/utils/LibMem/=lib/contracts-v2/contracts/src/utils/",
]

[fuzz]
runs = 512

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[lint]
lint_on_build = false
